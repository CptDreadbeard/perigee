name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: pnpm install --frozen-lockfile

      # After work plan step 0.5, replace the steps below with: pnpm verify
      - name: Check the frontend
        run: pnpm check

      # The frontend build must run before clippy. Tauri reads the build folder.
      - name: Build the frontend
        run: pnpm build

      - name: Check the Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Run clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Run the Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace
